; PlatformIO Project Configuration — sensor-node (V2)
;
; Two build envs:
;   yolo_uno           — ESP-NOW only (default). CoreIoT plugin EXCLUDED.
;   yolo_uno_coreiot   — ESP-NOW + CoreIoT/MQTT telemetry (USE_COREIOT=1).
;                        CoreIoT plugin INCLUDED. (R6: module built in >=1 env.)
;
; Host unit tests (no board needed):
;   pio test -e native

[platformio]
default_envs = yolo_uno

[env]
monitor_speed = 115200
; Shared contract lives in firmware/shared/ (R2/R3/R4) — add to include path.
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -I../shared

[env:yolo_uno]
platform = espressif32@7.0.1
board = yolo_uno
framework = arduino
; CoreIoT plugin not compiled: no MQTT dep needed.
build_src_filter = +<*> -<plugins>

[env:yolo_uno_coreiot]
platform = espressif32@7.0.1
board = yolo_uno
framework = arduino
build_flags =
    ${env.build_flags}
    -D USE_COREIOT=1
    -Isrc/plugins/coreiot
build_src_filter = +<*> -<plugins> +<plugins/coreiot>
lib_deps = knolleary/PubSubClient@^2.8

; Đo độ trễ (DMXT-57) — KHÔNG dùng cho bản phát hành. Xem docs/LATENCY_TEST.md.
;   yolo_uno_latency          ESP-NOW only + RTT qua echo + log "LAT ..."
;   yolo_uno_coreiot_latency  như trên + MQTT CoreIoT (đo cả đường phụ)
; Màn hình phải chạy env yolo_uno_latency tương ứng (echo seq).
[env:yolo_uno_latency]
extends = env:yolo_uno
build_flags =
    ${env.build_flags}
    -D TBS_LATENCY_PROBE=1

[env:yolo_uno_coreiot_latency]
extends = env:yolo_uno_coreiot
build_flags =
    ${env:yolo_uno_coreiot.build_flags}
    -D TBS_LATENCY_PROBE=1

; Đo độ chính xác / tầm đo / góc búp (DMXT-55/56) — KHÔNG dùng cho bản phát hành.
; In "ACC S<i> raw= out= ..." mỗi lần đọc, đọc cả cảm biến DISCONNECTED mỗi chu kỳ.
; Xem docs/ACCURACY_TEST.md.
[env:yolo_uno_accuracy]
extends = env:yolo_uno
build_flags =
    ${env.build_flags}
    -D TBS_ACCURACY_PROBE=1

; Thử thuật toán lọc: đẩy raw / filtered / mốc chuẩn của 6 cảm biến lên CoreIoT (thêm 18 trường
; std/raw/fltN vào payload) — KHÔNG dùng cho bản phát hành. Xem docs/algorithm_test_changes.md.
[env:yolo_uno_coreiot_algotest]
extends = env:yolo_uno_coreiot
build_flags =
    ${env:yolo_uno_coreiot.build_flags}
    -D TBS_ALGO_TEST=1

[env:native]
platform = native
test_framework = unity
; Build project src alongside tests + only include pure-C++ host-testable
; module (no Arduino/FreeRTOS deps).
test_build_src = yes
build_src_filter = +<distance_filter.cpp>
build_flags =
    -I../shared
    -Iinclude
    -Itest
test_filter = +<test_distance_filter.cpp> +<test_thresholds.cpp> +<test_runner.cpp>
; PlatformIO Project Configuration — waveshare-screen (V2)
;
; framework = espidf (pure ESP-IDF, no Arduino core).
;
; Why not Arduino/hybrid: this display stack needs ESP-IDF >= 5.5
; (esp_lcd_panel_rgb num_fbs/bounce-buffer fields, the new i2c_master.h
; driver, esp_lcd_touch_gt911, esp_lvgl_adapter, LVGL 9.1). Plain
; `framework = espidf` uses an unconstrained ESP-IDF release and keeps the
; RGB panel/GT911 touch/LVGL code untouched (old repo built OK on this
; toolchain — see .pio/build/yolo_uno/firmware.bin).
;
; ESP-IDF CMake component-project layout is required: CMakeLists.txt,
; src/, components/*, sdkconfig.defaults.
;
; Networking (components/coreiot_client) uses esp_wifi/esp-mqtt (not
; Arduino) — same non-blocking task-shape as sensor-node's CoreiotClient.
;
; ESP-NOW receiver (shared contract firmware/shared/espnow_protocol.h) is
; wired in roadmap step B5; B4 is UI + sensor_model + coreiot_client
; scaffold.

[env:yolo_uno]
platform = espressif32@7.0.1
board = yolo_uno
framework = espidf
monitor_speed = 115200

board_build.partitions = partitions.csv
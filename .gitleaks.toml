# Gitleaks config — B7 (R1/R11).
# Giữ toàn bộ default rules; allowlist chỉ cho nội dung benign của repo này
# (commit hashes, hằng số hex trong code MQTT, MAC đặc tả phần cứng).
# KHÔNG thêm allowlist bao trùm docs/*.md — token trong tài liệu bị mask bởi
# scan_secrets.py, nhưng rule Gitleaks phải vẫn thấy nếu ai đó paste token thật.

title = "UMT-TBS-official gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Benign: commit hashes, hex literals, hardware MAC addresses"
regexes = [
  '''(?i)\b(?:commit|revision|sha)\b\s*[:=]?\s*[0-9a-f]{7,40}''',
  '''\b0x[0-9a-fA-F]{1,16}\b''',
  '''\b(?:[0-9A-F]{2}:){5}[0-9A-F]{2}\b''',
]